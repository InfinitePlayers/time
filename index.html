<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent HUD Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Force total transparency on root elements */
        html, body {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }

        .font-rajdhani {
            font-family: 'Rajdhani', sans-serif;
        }

        /* Border Glow Animations & Styles */
        .hud-border-box {
            transition: border-color 0.6s ease-in-out, box-shadow 0.6s ease-in-out;
            border-style: solid;
            border-width: 4px;
            pointer-events: none;
        }

        .border-none-hud {
            border-color: transparent !important;
            box-shadow: none !important;
        }

        .border-green-hud {
            border-color: #10B981 !important;
            box-shadow: inset 0 0 18px rgba(16, 185, 129, 0.4), 0 0 22px rgba(16, 185, 129, 0.45);
        }

        .border-yellow-hud {
            border-color: #FBBF24 !important;
            box-shadow: inset 0 0 18px rgba(251, 191, 36, 0.4), 0 0 22px rgba(251, 191, 36, 0.45);
        }

        .border-orange-hud {
            border-color: #F97316 !important;
            box-shadow: inset 0 0 20px rgba(249, 115, 22, 0.45), 0 0 28px rgba(249, 115, 22, 0.5);
        }

        .border-red-hud {
            border-color: #EF4444 !important;
            animation: pulse-red-glow 1.5s infinite alternate;
        }

        @keyframes pulse-red-glow {
            0% {
                box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.35), 0 0 20px rgba(239, 68, 68, 0.4);
            }
            100% {
                box-shadow: inset 0 0 35px rgba(239, 68, 68, 0.65), 0 0 45px rgba(239, 68, 68, 0.75);
            }
        }
    </style>
</head>
<body class="w-screen h-screen bg-transparent p-0 m-0 overflow-hidden text-white font-rajdhani pointer-events-none">

    <!-- FULLSCREEN BORDER FRAME -->
    <div id="hud-frame" class="fixed inset-0 w-full h-full hud-border-box border-none-hud box-border pointer-events-none flex flex-col justify-between p-4 z-50">
        
        <!-- TOP HUD LAYER -->
        <div class="flex justify-between items-start w-full pointer-events-none">
            
            <!-- TOP LEFT: Compact Time & Countdown Display -->
            <div class="bg-black/80 border border-slate-700/80 backdrop-blur-md rounded-lg px-3.5 py-2 shadow-2xl flex items-center gap-3 pointer-events-auto">
                <!-- Live Clock -->
                <span id="current-time" class="font-orbitron text-sm font-bold text-cyan-300 tracking-wider">
                    --:--:--
                </span>
                
                <span class="text-slate-600 font-bold text-xs">|</span>

                <!-- Countdown -->
                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Left:</span>
                    <span id="countdown-display" class="font-orbitron text-sm font-bold text-slate-200 tracking-wider">
                        --:--:--
                    </span>
                </div>
            </div>

            <!-- TOP RIGHT: Polite Power-Down Message (Appears at 2 mins left / Time Up) -->
            <div id="power-down-message" class="hidden bg-black/90 border border-red-500/90 rounded-lg p-3 shadow-2xl backdrop-blur-md max-w-xs animate-pulse pointer-events-auto">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 shrink-0"></span>
                    <p class="text-xs font-bold text-red-200 leading-tight tracking-wide">
                        Time to wrap up! Powering down soon.
                    </p>
                </div>
            </div>

        </div>

        <!-- CENTER AREA: 100% Transparent with mouse click-through enabled -->
        <div class="flex-1 pointer-events-none"></div>

    </div>

    <script>
        /************************************************************************
         * EASY CONFIGURATION: EDIT YOUR TARGET POWER-DOWN TIME HERE
         * Use 24-hour HH:MM format (e.g. "19:45" or "21:30")
         ************************************************************************/
        const TARGET_TIME = "20:45";


        // DOM Elements
        const currentTimeEl = document.getElementById('current-time');
        const countdownDisplayEl = document.getElementById('countdown-display');
        const hudFrame = document.getElementById('hud-frame');
        const powerDownMsg = document.getElementById('power-down-message');

        // Helper: Pad single digits with leading zero
        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        // Parse TARGET_TIME into hours and minutes
        const [targetHours, targetMinutes] = TARGET_TIME.split(':').map(n => parseInt(n, 10));

        // Main HUD Update Loop
        function updateHUD() {
            const now = new Date();

            // Current Local Time (HH:MM:SS)
            const hrs = now.getHours();
            const mins = now.getMinutes();
            const secs = now.getSeconds();
            currentTimeEl.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;

            // Build Target Date Object for Today
            const targetDate = new Date();
            targetDate.setHours(targetHours, targetMinutes, 0, 0);

            // Calculate Difference
            let diffMs = targetDate.getTime() - now.getTime();
            let totalRemainingSeconds = Math.floor(diffMs / 1000);
            let totalRemainingMinutes = totalRemainingSeconds / 60;

            // Reset HUD Frame Class List
            hudFrame.className = "fixed inset-0 w-full h-full hud-border-box box-border pointer-events-none flex flex-col justify-between p-4 z-50 ";

            if (totalRemainingSeconds <= 0) {
                // Past Target Time / Power Down
                hudFrame.classList.add('border-red-hud');
                countdownDisplayEl.textContent = "00:00:00";
                countdownDisplayEl.className = "font-orbitron text-sm font-bold text-red-400 tracking-wider";
                powerDownMsg.classList.remove('hidden');

            } else {
                // Format Countdown string (HH:MM:SS)
                const cHrs = Math.floor(totalRemainingSeconds / 3600);
                const cMins = Math.floor((totalRemainingSeconds % 3600) / 60);
                const cSecs = totalRemainingSeconds % 60;
                countdownDisplayEl.textContent = `${pad(cHrs)}:${pad(cMins)}:${pad(cSecs)}`;

                // Threshold logic for borders & notification
                if (totalRemainingMinutes <= 2) {
                    // <= 2 minutes: Red border + Polite Message
                    hudFrame.classList.add('border-red-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-red-400 tracking-wider";
                    powerDownMsg.classList.remove('hidden');
                } else if (totalRemainingMinutes <= 5) {
                    // <= 5 minutes: Orange border
                    hudFrame.classList.add('border-orange-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-orange-400 tracking-wider";
                    powerDownMsg.classList.add('hidden');
                } else if (totalRemainingMinutes <= 10) {
                    // <= 10 minutes: Yellow border
                    hudFrame.classList.add('border-yellow-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-yellow-400 tracking-wider";
                    powerDownMsg.classList.add('hidden');
                } else if (totalRemainingMinutes <= 15) {
                    // <= 15 minutes: Green border
                    hudFrame.classList.add('border-green-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-emerald-400 tracking-wider";
                    powerDownMsg.classList.add('hidden');
                } else {
                    // > 15 minutes: Clean transparent border
                    hudFrame.classList.add('border-none-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-cyan-300 tracking-wider";
                    powerDownMsg.classList.add('hidden');
                }
            }
        }

        // Start 1-second interval loop
        setInterval(updateHUD, 1000);
        updateHUD();
    </script>
</body>
</html>
