<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Power-Down Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: transparent;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }

        /* Scanline Overlay Effect for Sci-Fi HUD Vibe */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
        }

        /* HUD Dynamic Border Colors & Glows */
        .hud-border {
            transition: all 0.8s ease-in-out;
            border-style: solid;
            border-width: 4px;
        }

        .border-none-hud {
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .border-green-hud {
            border-color: #10B981;
            box-shadow: inset 0 0 25px rgba(16, 185, 129, 0.35), 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .border-yellow-hud {
            border-color: #FBBF24;
            box-shadow: inset 0 0 25px rgba(251, 191, 36, 0.35), 0 0 30px rgba(251, 191, 36, 0.4);
        }

        .border-orange-hud {
            border-color: #F97316;
            box-shadow: inset 0 0 25px rgba(249, 115, 22, 0.4), 0 0 35px rgba(249, 115, 22, 0.5);
        }

        .border-red-hud {
            border-color: #EF4444;
            box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.5), 0 0 45px rgba(239, 68, 68, 0.6);
            animation: pulse-red 2s infinite alternate;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.4), 0 0 25px rgba(239, 68, 68, 0.4);
            }
            100% {
                box-shadow: inset 0 0 40px rgba(239, 68, 68, 0.7), 0 0 50px rgba(239, 68, 68, 0.8);
            }
        }

        /* Subtle Corner Accents */
        .corner-accent {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: currentColor;
            pointer-events: none;
        }

        /* Settings Drawer Slide */
        .settings-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 bg-slate-950 text-white">

    <!-- 16:9 Aspect Ratio Frame Container -->
    <div id="hud-container" class="relative w-full max-w-[1920px] aspect-video max-h-screen hud-border border-none-hud rounded-lg overflow-hidden flex flex-col justify-between p-6">
        
        <!-- Optional Scanline Effect for Overlay Aesthetics -->
        <div class="scanlines absolute inset-0 pointer-events-none opacity-40"></div>

        <!-- TOP ROW: HUD Controls & Live Clock Box (Top Left) -->
        <div class="flex justify-between items-start z-10">
            
            <!-- TOP LEFT: Clock & Countdown Module -->
            <div class="flex flex-col gap-2">
                <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-lg p-3 px-4 shadow-lg min-w-[280px]">
                    
                    <!-- Current Live Clock -->
                    <div class="flex items-center justify-between gap-4 border-b border-slate-700/50 pb-1.5 mb-1.5">
                        <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-3.5 h-3.5 text-cyan-400"></i> Local Time
                        </span>
                        <span id="current-time" class="font-orbitron text-lg font-bold text-cyan-300 tracking-wider">--:--:--</span>
                    </div>

                    <!-- Target & Countdown -->
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] uppercase tracking-wider text-slate-400 flex items-center gap-1">
                                <i data-lucide="target" class="w-3 h-3 text-slate-400"></i> Target
                            </span>
                            <span id="target-time-display" class="font-orbitron text-xs font-semibold text-slate-200">19:45</span>
                        </div>

                        <div class="text-right">
                            <span class="text-[10px] uppercase tracking-wider text-slate-400">Remaining</span>
                            <div id="countdown-display" class="font-orbitron text-base font-extrabold text-emerald-400 tracking-wider">
                                --:--:--
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Polite Power-Down Message (Appears when countdown ends) -->
                <div id="power-down-message" class="hidden bg-red-950/90 border border-red-500/80 text-red-200 rounded-lg p-3 px-4 shadow-xl max-w-[320px] backdrop-blur-md animate-bounce">
                    <div class="flex items-start gap-2.5">
                        <i data-lucide="shield-alert" class="w-5 h-5 text-red-400 shrink-0 mt-0.5"></i>
                        <div>
                            <div class="font-orbitron text-xs font-bold uppercase text-red-300 tracking-wide">Time To Power Down</div>
                            <p class="text-xs text-red-100 mt-0.5 font-medium leading-tight">
                                Hey buddy! Great session. Time to wrap up, save your game, and log off for the night.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TOP RIGHT: Quick Controls Toggle -->
            <button id="toggle-settings-btn" class="bg-slate-900/80 hover:bg-slate-800/90 border border-slate-700/60 rounded-md p-2 text-slate-300 hover:text-white transition flex items-center gap-1.5 text-xs font-semibold backdrop-blur-md">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span>Configure Target</span>
            </button>
        </div>

        <!-- MIDDLE: Completely empty center area for game visibility / Hudfx rendering -->
        <div class="flex-1 pointer-events-none"></div>

        <!-- BOTTOM ROW: Minimalist System Status Bar -->
        <div class="flex justify-between items-end text-[10px] uppercase tracking-widest text-slate-500 font-mono z-10">
            <div class="flex items-center gap-2 bg-slate-900/60 backdrop-blur-sm px-2.5 py-1 rounded border border-slate-800">
                <span id="status-indicator-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span>HUD Status: <span id="hud-status-text" class="text-slate-300 font-bold">NORMAL</span></span>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-sm px-2.5 py-1 rounded border border-slate-800">
                16:9 Overlay Mode
            </div>
        </div>

        <!-- SETTINGS DRAWER OVERLAY -->
        <div id="settings-panel" class="settings-panel absolute top-16 right-6 bg-slate-900/95 border border-slate-700/80 rounded-xl p-4 shadow-2xl backdrop-blur-lg w-72 z-20 translate-x-[120%]">
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-2 mb-3">
                <h3 class="font-orbitron text-xs font-bold text-cyan-400 tracking-wider flex items-center gap-1.5">
                    <i data-lucide="sliders" class="w-3.5 h-3.5"></i> Target Settings
                </h3>
                <button id="close-settings-btn" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Set Target Time (24h)</label>
                    <input type="time" id="target-time-input" value="19:45" class="w-full bg-slate-800 border border-slate-600 rounded px-2.5 py-1.5 text-sm font-orbitron text-cyan-300 focus:outline-none focus:border-cyan-400">
                </div>

                <div class="pt-2 border-t border-slate-800 flex flex-col gap-1.5">
                    <span class="text-[10px] uppercase text-slate-400">Color Thresholds:</span>
                    <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-300">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 15m remaining</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400"></span> 10m remaining</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-500"></span> 5m remaining</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span> 2m / Ended</span>
                    </div>
                </div>

                <button id="save-target-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-1.5 rounded text-xs tracking-wider uppercase transition mt-2 font-orbitron">
                    Apply Changes
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // State Variables
        let targetHours = 19;
        let targetMinutes = 45;

        // DOM Elements
        const currentTimeEl = document.getElementById('current-time');
        const targetTimeDisplayEl = document.getElementById('target-time-display');
        const countdownDisplayEl = document.getElementById('countdown-display');
        const hudContainer = document.getElementById('hud-container');
        const powerDownMsg = document.getElementById('power-down-message');
        const hudStatusText = document.getElementById('hud-status-text');
        const statusDot = document.getElementById('status-indicator-dot');

        const settingsPanel = document.getElementById('settings-panel');
        const toggleSettingsBtn = document.getElementById('toggle-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveTargetBtn = document.getElementById('save-target-btn');
        const targetTimeInput = document.getElementById('target-time-input');

        // Toggle Settings Drawer
        toggleSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('translate-x-[120%]');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('translate-x-[120%]');
        });

        // Save Target Time
        saveTargetBtn.addEventListener('click', () => {
            const timeValue = targetTimeInput.value;
            if (timeValue) {
                const parts = timeValue.split(':');
                targetHours = parseInt(parts[0], 10);
                targetMinutes = parseInt(parts[1], 10);

                // Update UI Display
                targetTimeDisplayEl.textContent = timeValue;
                settingsPanel.classList.add('translate-x-[120%]');
                updateHUD();
            }
        });

        // Format single digit with leading zero
        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        // Main Update Cycle
        function updateHUD() {
            const now = new Date();
            
            // Update Clock (HH:MM:SS)
            const currentH = now.getHours();
            const currentM = now.getMinutes();
            const currentS = now.getSeconds();
            currentTimeEl.textContent = `${pad(currentH)}:${pad(currentM)}:${pad(currentS)}`;

            // Calculate Target Date Object
            const targetDate = new Date();
            targetDate.setHours(targetHours, targetMinutes, 0, 0);

            // Calculate Difference in milliseconds
            let diffMs = targetDate.getTime() - now.getTime();
            let totalRemainingSeconds = Math.floor(diffMs / 1000);

            // Calculate border state thresholds based on minutes
            const totalRemainingMinutes = totalRemainingSeconds / 60;

            // Reset Border Classes
            hudContainer.className = 'relative w-full max-w-[1920px] aspect-video max-h-screen hud-border rounded-lg overflow-hidden flex flex-col justify-between p-6 ';

            if (totalRemainingSeconds <= 0) {
                // Time Up or Past Target
                hudContainer.classList.add('border-red-hud');
                countdownDisplayEl.textContent = "00:00:00";
                countdownDisplayEl.className = "font-orbitron text-base font-extrabold text-red-500 tracking-wider";
                
                // Show Polite Message
                powerDownMsg.classList.remove('hidden');

                // Update Status Bar
                hudStatusText.textContent = "POWER DOWN REQUIRED";
                hudStatusText.className = "text-red-400 font-bold";
                statusDot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";

            } else {
                // Hide Power Down Message while countdown is active
                powerDownMsg.classList.add('hidden');

                // Format Countdown Display (HH:MM:SS)
                const hrs = Math.floor(totalRemainingSeconds / 3600);
                const mins = Math.floor((totalRemainingSeconds % 3600) / 60);
                const secs = totalRemainingSeconds % 60;
                countdownDisplayEl.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;

                // Dynamic Color Border Threshold Logic
                if (totalRemainingMinutes <= 2) {
                    // <= 2 minutes: Red
                    hudContainer.classList.add('border-red-hud');
                    countdownDisplayEl.className = "font-orbitron text-base font-extrabold text-red-400 tracking-wider";
                    hudStatusText.textContent = "CRITICAL LIMIT";
                    hudStatusText.className = "text-red-400 font-bold";
                    statusDot.className = "w-2 h-2 rounded-full bg-red-500";
                } else if (totalRemainingMinutes <= 5) {
                    // <= 5 minutes: Orange
                    hudContainer.classList.add('border-orange-hud');
                    countdownDisplayEl.className = "font-orbitron text-base font-extrabold text-orange-400 tracking-wider";
                    hudStatusText.textContent = "WARM WARNING";
                    hudStatusText.className = "text-orange-400 font-bold";
                    statusDot.className = "w-2 h-2 rounded-full bg-orange-500";
                } else if (totalRemainingMinutes <= 10) {
                    // <= 10 minutes: Yellow
                    hudContainer.classList.add('border-yellow-hud');
                    countdownDisplayEl.className = "font-orbitron text-base font-extrabold text-yellow-400 tracking-wider";
                    hudStatusText.textContent = "APPROACHING TARGET";
                    hudStatusText.className = "text-yellow-400 font-bold";
                    statusDot.className = "w-2 h-2 rounded-full bg-yellow-400";
                } else if (totalRemainingMinutes <= 15) {
                    // <= 15 minutes: Green
                    hudContainer.classList.add('border-green-hud');
                    countdownDisplayEl.className = "font-orbitron text-base font-extrabold text-emerald-400 tracking-wider";
                    hudStatusText.textContent = "NOTICE ACTIVE";
                    hudStatusText.className = "text-emerald-400 font-bold";
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                } else {
                    // > 15 minutes: Standard transparent HUD
                    hudContainer.classList.add('border-none-hud');
                    countdownDisplayEl.className = "font-orbitron text-base font-extrabold text-cyan-400 tracking-wider";
                    hudStatusText.textContent = "NORMAL";
                    hudStatusText.className = "text-slate-300 font-bold";
                    statusDot.className = "w-2 h-2 rounded-full bg-cyan-500";
                }
            }
        }

        // Initialize Loop
        setInterval(updateHUD, 1000);
        updateHUD();
    </script>
