<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Gaming HUD Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: transparent;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }

        .hud-border {
            transition: border-color 0.8s ease-in-out, box-shadow 0.8s ease-in-out;
            border-style: solid;
            border-width: 4px;
            pointer-events: none;
        }

        /* Border Glow States */
        .border-none-hud {
            border-color: transparent;
            box-shadow: none;
        }

        .border-green-hud {
            border-color: #10B981;
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.35), 0 0 25px rgba(16, 185, 129, 0.4);
        }

        .border-yellow-hud {
            border-color: #FBBF24;
            box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.35), 0 0 25px rgba(251, 191, 36, 0.4);
        }

        .border-orange-hud {
            border-color: #F97316;
            box-shadow: inset 0 0 22px rgba(249, 115, 22, 0.4), 0 0 30px rgba(249, 115, 22, 0.5);
        }

        .border-red-hud {
            border-color: #EF4444;
            box-shadow: inset 0 0 28px rgba(239, 68, 68, 0.5), 0 0 40px rgba(239, 68, 68, 0.6);
            animation: pulse-red-glow 2s infinite alternate;
        }

        @keyframes pulse-red-glow {
            0% {
                box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.3), 0 0 20px rgba(239, 68, 68, 0.3);
            }
            100% {
                box-shadow: inset 0 0 35px rgba(239, 68, 68, 0.6), 0 0 45px rgba(239, 68, 68, 0.7);
            }
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 bg-transparent text-white">

    <div id="hud-container" class="relative w-full max-w-[1920px] aspect-video max-h-screen hud-border border-none-hud rounded-lg p-5 flex flex-col justify-between pointer-events-none">
        
        <!-- TOP HUD ROW -->
        <div class="flex justify-between items-start w-full">
            
            <!-- TOP LEFT: Compact Time & Countdown Display -->
            <div class="bg-slate-950/85 border border-slate-700/60 backdrop-blur-md rounded-md px-3 py-1.5 shadow-lg flex items-center gap-3">
                <!-- Live Clock -->
                <span id="current-time" class="font-orbitron text-sm font-bold text-cyan-300 tracking-wider">
                    --:--:--
                </span>
                
                <span class="text-slate-600 font-bold text-xs">|</span>

                <!-- Countdown -->
                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Left:</span>
                    <span id="countdown-display" class="font-orbitron text-sm font-bold text-slate-200 tracking-wider">
                        --:--:--
                    </span>
                </div>
            </div>

            <!-- TOP RIGHT: Polite Power-Down Message (Appears only on Red/Time Up) -->
            <div id="power-down-message" class="hidden bg-slate-950/90 border border-red-500/80 rounded-md p-2.5 px-3.5 shadow-2xl backdrop-blur-md max-w-xs animate-pulse">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 shrink-0"></span>
                    <p class="text-xs font-semibold text-red-200 leading-snug">
                        Time to wrap up! Powering down soon.
                    </p>
                </div>
            </div>

        </div>

        <!-- MIDDLE REGION: Entirely empty and transparent for uninterrupted gameplay -->
        <div class="flex-1"></div>

    </div>

    <script>
        /************************************************************************
         * EASY CONFIGURATION: EDIT YOUR TARGET POWER-DOWN TIME HERE
         * Use 24-hour HH:MM format (e.g. "19:45" or "21:30")
         ************************************************************************/
        const TARGET_TIME = "19:45";


        // DOM Elements
        const currentTimeEl = document.getElementById('current-time');
        const countdownDisplayEl = document.getElementById('countdown-display');
        const hudContainer = document.getElementById('hud-container');
        const powerDownMsg = document.getElementById('power-down-message');

        // Helper: Pad single digits with leading zero
        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        // Parse TARGET_TIME into hours and minutes
        const [targetHours, targetMinutes] = TARGET_TIME.split(':').map(n => parseInt(n, 10));

        // Main HUD Update Loop
        function updateHUD() {
            const now = new Date();

            // Current Time (HH:MM:SS)
            const hrs = now.getHours();
            const mins = now.getMinutes();
            const secs = now.getSeconds();
            currentTimeEl.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;

            // Build Target Date for Today
            const targetDate = new Date();
            targetDate.setHours(targetHours, targetMinutes, 0, 0);

            // Time difference calculation
            let diffMs = targetDate.getTime() - now.getTime();
            let totalRemainingSeconds = Math.floor(diffMs / 1000);
            let totalRemainingMinutes = totalRemainingSeconds / 60;

            // Reset base HUD border classes
            hudContainer.className = "relative w-full max-w-[1920px] aspect-video max-h-screen hud-border rounded-lg p-5 flex flex-col justify-between pointer-events-none ";

            if (totalRemainingSeconds <= 0) {
                // Time up / Past Target Time
                hudContainer.classList.add('border-red-hud');
                countdownDisplayEl.textContent = "00:00:00";
                countdownDisplayEl.className = "font-orbitron text-sm font-bold text-red-400 tracking-wider";
                
                // Show polite top-right notification
                powerDownMsg.classList.remove('hidden');

            } else {
                // Countdown active
                powerDownMsg.classList.add('hidden');

                // Format Countdown string (HH:MM:SS)
                const cHrs = Math.floor(totalRemainingSeconds / 3600);
                const cMins = Math.floor((totalRemainingSeconds % 3600) / 60);
                const cSecs = totalRemainingSeconds % 60;
                countdownDisplayEl.textContent = `${pad(cHrs)}:${pad(cMins)}:${pad(cSecs)}`;

                // Threshold logic for borders & colors
                if (totalRemainingMinutes <= 2) {
                    // <= 2 minutes: Red border
                    hudContainer.classList.add('border-red-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-red-400 tracking-wider";
                    powerDownMsg.classList.remove('hidden'); // Show notice at 2 minute mark
                } else if (totalRemainingMinutes <= 5) {
                    // <= 5 minutes: Orange border
                    hudContainer.classList.add('border-orange-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-orange-400 tracking-wider";
                } else if (totalRemainingMinutes <= 10) {
                    // <= 10 minutes: Yellow border
                    hudContainer.classList.add('border-yellow-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-yellow-400 tracking-wider";
                } else if (totalRemainingMinutes <= 15) {
                    // <= 15 minutes: Green border
                    hudContainer.classList.add('border-green-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-emerald-400 tracking-wider";
                } else {
                    // > 15 minutes: Clean transparent border
                    hudContainer.classList.add('border-none-hud');
                    countdownDisplayEl.className = "font-orbitron text-sm font-bold text-cyan-300 tracking-wider";
                }
            }
        }

        // Run update every second
        setInterval(updateHUD, 1000);
        updateHUD();
    </script>
</body>
</html>
